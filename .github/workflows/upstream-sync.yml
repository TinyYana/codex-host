name: Upstream sync

# Keeps this downstream fork on upstream/main through ordinary merge commits.
# No upstream progress: exits quietly. New progress: merges on a dedicated
# branch, runs the repository check plus the fork contract, then opens or
# updates one PR and dispatches the full CI matrix on it. Never writes main.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: BytePioneer-AI/codex-host
  BASE_BRANCH: main
  SYNC_BRANCH: sync/upstream
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  sync:
    name: Merge upstream main
    if: github.repository == 'TinyYana/codex-host'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Detect upstream progress
        id: detect
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            echo "${BASE_BRANCH} already contains ${UPSTREAM_REPOSITORY}@${upstream_sha}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # An open proposal that already merges this upstream commit onto the
          # current base needs no new run.
          if git fetch --no-tags origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null &&
            git merge-base --is-ancestor upstream/main "origin/${SYNC_BRANCH}" &&
            git merge-base --is-ancestor HEAD "origin/${SYNC_BRANCH}"; then
            echo "state=proposed" >> "$GITHUB_OUTPUT"
            echo "${SYNC_BRANCH} already proposes ${UPSTREAM_REPOSITORY}@${upstream_sha}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "state=behind" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main
        id: merge
        if: steps.detect.outputs.state == 'behind'
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${SYNC_BRANCH}"
          if git merge --no-ff --no-edit \
            -m "merge: sync upstream ${UPSTREAM_REPOSITORY} main (${UPSTREAM_SHA:0:8})" upstream/main; then
            exit 0
          fi
          # Leave evidence an agent or maintainer can resolve from; never push a conflicted tree.
          mkdir -p sync-evidence
          git diff --name-only --diff-filter=U > sync-evidence/conflicted-files.txt
          git status --porcelain=v1 > sync-evidence/status.txt
          git diff > sync-evidence/conflicts.diff
          git log --oneline "HEAD..upstream/main" > sync-evidence/upstream-commits.txt
          {
            echo "## Upstream merge conflict"
            echo
            echo "Merging ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA} into ${BASE_BRANCH} stopped on conflicts."
            echo "Resolve locally with \`git fetch upstream && git merge upstream/main\` on a branch from ${BASE_BRANCH},"
            echo "keep the fork capabilities listed in \`packages/repository-automation/test/fork-contract.test.mjs\`, and open a PR."
            echo
            echo '```text'
            cat sync-evidence/conflicted-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge conflicts; see the job summary and the upstream-sync-conflict artifact."
          exit 1

      - name: Upload conflict evidence
        if: failure() && steps.merge.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-conflict
          path: sync-evidence/
          retention-days: 14

      - name: Setup Node.js
        if: steps.detect.outputs.state == 'behind'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        if: steps.detect.outputs.state == 'behind'
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        if: steps.detect.outputs.state == 'behind'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install dependencies
        if: steps.detect.outputs.state == 'behind'
        run: npm ci --prefer-offline

      # Fails fast and by name when a merge dropped a fork capability or its tests.
      - name: Check fork contract
        if: steps.detect.outputs.state == 'behind'
        run: npx vitest run --config tests/vitest.config.js packages/repository-automation/test/fork-contract.test.mjs

      - name: Repository check
        if: steps.detect.outputs.state == 'behind'
        run: npm run check

      - name: Publish sync branch and PR
        if: steps.detect.outputs.state == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          # The sync branch is regenerated from the base each run; only it is force-updated.
          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
          title="merge: sync upstream ${UPSTREAM_REPOSITORY} main (${UPSTREAM_SHA:0:8})"
          body="$(printf 'Merges [%s@%s](https://github.com/%s/commit/%s) into `%s` with an ordinary merge commit.\n\nVerified in the sync run before this PR was opened or updated: fork contract and `npm run check`. The full CI matrix is dispatched on `%s`.\n\nRun: %s/%s/actions/runs/%s' \
            "${UPSTREAM_REPOSITORY}" "${UPSTREAM_SHA:0:8}" "${UPSTREAM_REPOSITORY}" "${UPSTREAM_SHA}" "${BASE_BRANCH}" \
            "${SYNC_BRANCH}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          number="$(gh pr list --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh pr edit "${number}" --title "${title}" --body "${body}"
          elif ! gh pr create --head "${SYNC_BRANCH}" --base "${BASE_BRANCH}" --title "${title}" --body "${body}"; then
            {
              echo "## Sync branch pushed, PR not created"
              echo
              echo "Verified merge is on \`${SYNC_BRANCH}\`. GitHub refused the PR for this token;"
              echo "enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*,"
              echo "or open it manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${SYNC_BRANCH}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Could not create the sync PR; see the job summary."
            exit 1
          fi
          # PRs and pushes made with GITHUB_TOKEN do not trigger CI; dispatch it explicitly.
          gh workflow run ci.yml --ref "${SYNC_BRANCH}"
